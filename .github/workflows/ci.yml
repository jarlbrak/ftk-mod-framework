name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  launcher:
    name: Launcher helpers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Validate community catalog
        working-directory: launcher/helper
        run: go run . marketplace-catalog-validate --catalog ../../marketplace/catalog.json
      - name: Shortcut and artwork tests
        working-directory: launcher/helper
        run: go test ./...
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows launcher (no game required)
        run: dotnet build launcher/windows/FtkModdedLauncher.csproj -c Release
      - name: Windows installer offline checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./launcher/windows/verify-installer.ps1
      - name: Release integrity metadata checks
        if: runner.os != 'Windows'
        run: python3 launcher/tools/test-release-manifest.py
      - name: Unix launcher fast path
        if: runner.os != 'Windows'
        run: bash launcher/unix/test-launch.sh

  guard:
    name: Repository policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate agent instruction graph
        run: bash scripts/agent/check-instructions.sh
      - name: Fail if any copyrighted game assembly is tracked
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git ls-files | grep -E '(Assembly-CSharp[^/]*|UnityEngine[^/]*|Newtonsoft\.Json)\.dll$' || true)"
          if [ -n "$matches" ]; then
            echo "ERROR: copyrighted game assemblies are tracked in git:"
            echo "$matches"
            echo "These must never be committed. Reference them from the local game install instead."
            exit 1
          fi
          echo "OK: no copyrighted game assemblies are tracked."

  test:
    name: Unit tests (Unity-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Player mod discovery and enable-state checks
        run: dotnet run --project FTKModFramework/Tests/PlayerMods/PlayerMods.csproj -c Release
      - name: Run the game-free unit tests
        run: dotnet test FTKPerfProbe.Tests/FTKPerfProbe.Tests.csproj -c Release

  installer:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Lint the shell scripts
        if: runner.os == 'Linux'
        run: shellcheck -s bash install.sh deploy.sh release.sh tests/installer/test-install.sh launcher/build.sh launcher/unix/*.sh launcher/unix/setup.command scripts/agent/check-instructions.sh scripts/agent/hooks/*.sh
      - name: Installer test suite (mock Steam layouts, real BepInEx archives)
        run: bash tests/installer/test-install.sh
