name: Thunderstore release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag to publish to Thunderstore
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: thunderstore-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: thunderstore
    steps:
      - name: Check out the current package builder
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check out the published release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          path: release-source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET for Thunderstore CLI
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the immutable Thunderstore package
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          THUNDERSTORE_NAMESPACE: ${{ vars.THUNDERSTORE_NAMESPACE }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OUTPUT_DIR: ${{ runner.temp }}/thunderstore-package
        shell: bash
        run: |
          set -euo pipefail
          test -n "$THUNDERSTORE_NAMESPACE" || { echo "Set the THUNDERSTORE_NAMESPACE repository variable." >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name' >/dev/null

          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            framework_version="${RELEASE_TAG#v}"
            mkdir -p "$RUNNER_TEMP/ftkmf-release"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern FTKModFramework.dll --dir "$RUNNER_TEMP/ftkmf-release"
            python3 marketplace/packages/build_thunderstore.py \
              --tag "$RELEASE_TAG" \
              --namespace "$THUNDERSTORE_NAMESPACE" \
              --framework-dll "$RUNNER_TEMP/ftkmf-release/FTKModFramework.dll" \
              --source-root "$GITHUB_WORKSPACE/release-source" \
              --output "$OUTPUT_DIR"
          else
            framework_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
            [[ "$framework_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Latest stable GitHub release is not an FTK Mod Framework version: $framework_tag" >&2
              exit 1
            }
            framework_version="${framework_tag#v}"
            dependency_url="https://thunderstore.io/api/experimental/package/$THUNDERSTORE_NAMESPACE/FTKModFramework/$framework_version/"
            curl --fail --silent --show-error "$dependency_url" >/dev/null || {
              echo "Publish FTKModFramework $framework_version to Thunderstore before publishing content packages." >&2
              exit 1
            }
            python3 marketplace/packages/build_thunderstore.py \
              --tag "$RELEASE_TAG" \
              --namespace "$THUNDERSTORE_NAMESPACE" \
              --framework-version "$framework_version" \
              --source-root "$GITHUB_WORKSPACE/release-source" \
              --output "$OUTPUT_DIR"
          fi

          package_zip="$(find "$OUTPUT_DIR" -type f -name package.zip -print -quit)"
          test -n "$package_zip" || { echo "Thunderstore package build produced no package.zip." >&2; exit 1; }
          package_dir="$(dirname "$package_zip")"
          echo "package_dir=$package_dir" >> "$GITHUB_OUTPUT"

      - name: Install pinned Thunderstore CLI
        run: dotnet tool install --tool-path "$RUNNER_TEMP/tcli" tcli --version 0.2.4

      - name: Publish package
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_API_TOKEN }}
          PACKAGE_DIR: ${{ steps.build.outputs.package_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TCLI_AUTH_TOKEN" || { echo "Set the THUNDERSTORE_API_TOKEN Actions secret." >&2; exit 1; }
          "$RUNNER_TEMP/tcli/tcli" publish \
            --file "$PACKAGE_DIR/package.zip" \
            --config-path "$PACKAGE_DIR/thunderstore.toml"
